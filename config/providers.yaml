# ============================================================================
# Callisto model providers — ENDPOINT POOL config (instance 5, 2026-08-22)
# ============================================================================
#
# CONTRACT (SCOPE CORRECTION 2026-08-22): adding compute is a CONFIG ENTRY.
# Today: one RTX 5060 Ti 16 GB. Tomorrow: 3090s, 5090s, DGX Spark. Each
# `providers:` entry below is ONE model server process declaring:
#
#   base_url            OpenAI-compatible endpoint (llama-server / vLLM /
#                       Ollama's /v1, local or remote box)
#   model               model name the server was launched with
#   context_tokens      usable context window
#   structured_output   json_schema response_format supported? (default true)
#   tool_calls          native function calling? (default false)
#   max_concurrency     parallel in-flight requests the server can take.
#                       llama-server defaults to ONE slot: -c ... --parallel N
#                       if you raise it; set this to match or fan-out thrashes.
#   cost_per_1k_input/output   USD; local endpoints are 0 (free at margin)
#
# Routing picks by task class -> ordered endpoint list -> health + capability,
# with per-endpoint concurrency limits, exponential cooldown on failures and
# automatic failover down the list. Dead GPU box = degraded, not crashed.
#
# SCALING RECIPES — copy an entry, change name/base_url/model, done:
#   * second box (e.g. a 3090 running qwen3.8-27b): add `gpu2:` with its LAN
#     URL, append it to research_synthesis/hypothesis_generation lists.
#   * DGX Spark alongside: add `spark:` with big model + max_concurrency: 4,
#     put it FIRST for promotion_judgment/adversarial_review.
#   * bigger single GPU (5090 32GB): swap gpu1's model to a Q4 quant of the
#     same family; nothing else changes.

default_tier: gpu1

providers:
  gpu1:
    # RTX 5060 Ti 16 GB — quality-first resident model (today's hardware).
    backend: llama_cpp_server
    base_url: http://localhost:8080/v1
    model: qwen3.8-27b-ud-q3_k_xl
    context_tokens: 32768
    temperature: 0.2
    structured_output: true       # grammar-constrained JSON via --jinja
    tool_calls: true              # native templates via --jinja
    max_concurrency: 1            # llama-server default; raise WITH --parallel
    vram_gb: 16

  gpu1_fast:
    # High-volume grind on spare VRAM / second small server process.
    backend: llama_cpp_server
    base_url: http://localhost:8081/v1
    model: gemma4-e4b
    context_tokens: 16384
    temperature: 0.1
    structured_output: true
    tool_calls: false
    max_concurrency: 1
    vram_gb: 10

  frontier:
    # The few hard judgment calls. Hosted, paid, budgeted, swappable by env.
    backend: openai_compat
    base_url_env: FRONTIER_BASE_URL      # e.g. https://openrouter.ai/api/v1
    api_key_env: FRONTIER_API_KEY
    model_env: FRONTIER_MODEL
    context_tokens: 200000
    temperature: 0.2
    structured_output: true
    tool_calls: true
    max_concurrency: 4
    cost_per_1k_input: 3.0        # EDIT to your actual hosted pricing
    cost_per_1k_output: 15.0

  ox_alpha:
    # ── OX ALPHA AS A FIRST-CLASS PROVIDER (build pass, 2026-08-22) ──────
    # The Hermes CLI driving Nous Portal's hosted stealth-ox-alpha model.
    # Auth is the CLI's own keychain OAuth entry — no env vars, no keys,
    # no GPU. `git clone` + `hermes portal login` runs this whole file.
    backend: hermes_cli
    model: ox-alpha
    context_tokens: 128000          # hosted context; CLI flattens messages
                                    # into one prompt, so treat as ceiling
    temperature: 0.2
    structured_output: false        # HONEST: JSON-in-text only. No
                                    # response_format enforcement exists;
                                    # callers get best-effort JSON extraction.
    tool_calls: false               # one-shot prompt in, text out. No native
                                    # function calling through `-z`.
    max_concurrency: 1              # ONE session per call: each completion is
                                    # a fresh process (~14s startup). The
                                    # shared fork-bounding semaphore
                                    # (CALLISTO_HERMES_MAX_PROCS, default 3)
                                    # caps total concurrent hermes processes.
    streaming: false                # no streaming; whole answer or nothing
    startup_latency_s: 14           # budget timeouts accordingly
    cost_per_1k_input: 0.0          # free at the margin (subscription)
    cost_per_1k_output: 0.0

routing:
  # task_class -> one endpoint (exact) or a LIST of endpoints in failover
  # order. Canonical classes below; call-site legacy names are bridged in
  # inference.TASK_CLASS_ALIASES (deep_work->research_synthesis,
  # hypothesis_gen->hypothesis_generation, reasoning->research_synthesis,
  # review->adversarial_review, code_generation->research_synthesis).
  #
  # ox_alpha is appended to EVERY class as last-resort failover so a laptop
  # with no local model and no API keys still runs the whole system — it is
  # tried only after every configured local/GPU/frontier endpoint fails.
  task_classes:
    hypothesis_generation: [gpu1, frontier, ox_alpha]
    research_synthesis: [gpu1, frontier, ox_alpha]
    screening: [gpu1_fast, ox_alpha]
    extraction: [gpu1_fast, ox_alpha]
    classification: [gpu1_fast, ox_alpha]
    backtest_interpretation: [gpu1, frontier, ox_alpha]
    promotion_judgment: [frontier, gpu1, ox_alpha]   # frontier preferred; falls back LOCAL if budget spent/unset
    adversarial_review: [frontier, gpu1, ox_alpha]
    # Knowledge-wiki compilation (tools/knowledge_wiki). Local-first: the
    # wiki is bulk background work — a resident local model is the right
    # default, frontier available as failover.
    wiki_compile: [gpu1, ox_alpha]

  escalation:
    # Cheap checks first. Escalation is the design, not an apology.
    json_schema_failures: 2
    tool_error_loops: 2
    disagreement: true
    confidence_below: 0.60
    sensitive_context_stays_local: true

  budget:
    # Hosted spend cap per process lifetime. When spent, paid endpoints
    # refuse unless a caller passes allow_budget_exceed=True deliberately.
    usd: 5.00

  health_checks:
    enabled: true

  # ── W2: EMPIRICAL MODEL ROUTING ──────────────────────────────────────────
  # When enabled, ProviderRouter.complete(role=...) consults the measured
  # per-(role, model) score store (tools/routing/, fed by tools/retrodiction
  # runs) and reorders the candidate tier list: Thompson sampling over each
  # model's Brier record, with a cost penalty so a model that scores 2%
  # better at 50x the price usually loses the draw. Local endpoints are free
  # at the margin, so exploring them is nearly costless.
  #
  # OFF by default: with no measurements, or with this disabled, routing is
  # byte-identical to the configured task_classes order. Nothing gets worse
  # before measurements exist.
  empirical_routing:
    enabled: false          # flip on once retrodiction runs have scored models
    cost_weight: 0.5        # 0 = pure quality; 1 = cost dominates
    usd_per_brier_point: 5.0  # $ paid per 1.0 mean-Brier improvement = break-even

notes: >-
  Plug-and-play contract: today this file describes exactly one 5060 Ti +
  a small grind server + an env-backed frontier endpoint, and degrades to
  just gpu1 if everything else is dead. Adding a 3090/5090/DGX Spark is a
  new providers: entry plus appending its name to the relevant
  task_classes lists. No code changes, ever.
