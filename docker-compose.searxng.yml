# SearXNG — self-hosted metasearch engine for Callisto
# Zero cost, no API key, no query limits.
# Aggregates Google, Bing, DuckDuckGo, Wikipedia, and more.
#
# Usage:
#   docker compose -f docker-compose.searxng.yml up -d
#
# Then set SEARXNG_URL=http://localhost:8888 in .env

services:
  searxng:
    image: searxng/searxng:latest
    container_name: callisto-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
